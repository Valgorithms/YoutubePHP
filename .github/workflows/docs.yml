name: Build Docs

on:
  pull_request:
    paths: ['src/**', 'docs/**', 'tools/*docs.php', 'phpdoc.dist.xml', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['src/**', 'docs/**', 'tools/*docs.php', 'phpdoc.dist.xml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          php-version: '8.4'
          extensions: iconv, mbstring
          coverage: none
          tools: composer:2.9.8
      - name: Install local PlantUML and Graphviz for the class diagram
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends graphviz plantuml
      - name: Checkout pinned phpDocumentor toolchain
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: discord-php/phpdoc-tool
          ref: 40e5911a592e5fc4407096cebd5fb4aaf2e9df6f
          path: phpdoc-tool
          persist-credentials: false
      - name: Install locked toolchain and reviewed nullable-type patches
        run: >-
          composer install --working-dir=phpdoc-tool --no-dev --no-interaction
          --no-scripts --prefer-dist --no-progress
      - name: Generate and validate public output
        env:
          PHPDOC_PLANTUML: plantuml
          PHPDOC_PLANTUML_BIN: /usr/bin/plantuml
        run: |
          php tools/build-docs.php
          php tools/check-docs.php
      - name: Archive only generated public files
        run: tar --directory build -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Retain Pages artifact for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write # GitHub cannot branch-scope this; only generated gh-pages is written.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository metadata for gh-pages publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's generated site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Restore the validated site
        run: |
          mkdir site
          tar -xf pages-artifact/artifact.tar --directory site
      - name: Preserve generated gh-pages copy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: CNAME
      # GITHUB_TOKEN pushes do not themselves trigger a branch Pages build.
      # Explicitly deploy the same artifact instead of assuming gh-pages is live.
      - name: Publish the exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
