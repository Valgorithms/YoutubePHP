name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the bots this library serves mostly run there.
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff

      # The generated code is committed, so it must be exactly what the
      # committed spec generates: a hand edit, or a spec change nobody
      # regenerated after, fails here.
      - name: Generated code matches the spec
        run: |
          php tools/generate.php
          git status --porcelain -- src
          test -z "$(git status --porcelain -- src)"
